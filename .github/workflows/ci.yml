name: TraceDeck CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"

concurrency:
  group: tracedeck-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-guard:
    name: Docs Guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Resolve diff range
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            echo "DOCS_BASE_SHA=$(git merge-base HEAD origin/${{ github.base_ref }})" >> "$GITHUB_ENV"
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            echo "DOCS_BASE_SHA=4b825dc642cb6eb9a060e54bf8d69288fbee4904" >> "$GITHUB_ENV"
          else
            echo "DOCS_BASE_SHA=${{ github.event.before }}" >> "$GITHUB_ENV"
          fi

          echo "DOCS_HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Enforce changelog and docs updates
        run: node scripts/check-docs.mjs --base "$DOCS_BASE_SHA" --head "$DOCS_HEAD_SHA"

  verify:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: docs-guard
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        env:
          NPM_CONFIG_AUDIT: "false"
          NPM_CONFIG_FUND: "false"
        run: npm install

      - name: Validate workspace links
        run: npm run verify:workspaces

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
